<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Dni bez wypadku</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="stage">

  <!-- LOGO -->
  <div class="logo-wrap">
    <img id="logoImg" src="PT.png" alt="Logo">
  </div>

  <!-- LEWA STRONA: LUDZIK -->
  <div class="left">
    <img src="ludekbhp.png" alt="Ludzik BHP">
  </div>

  <!-- PRAWA STRONA: NAPISY -->
  <div class="board">

    <div class="row">
      <span class="label">DNI BEZ WYPADKU:</span>
      <span class="value" id="days">---</span>
    </div>

    <div class="row">
      <span class="label">REKORD DNI BEZ WYPADKU:</span>
      <span class="value" id="record">---</span>
    </div>

    <div class="row">
      <span class="label">DATA OSTATNIEGO WYPADKU:</span>
      <span class="value" id="last-date">--.--.----</span>
    </div>

  </div>
</div>

<div class="build" id="buildInfo"></div>

<script src="script.js"></script>
</body>
</html>
