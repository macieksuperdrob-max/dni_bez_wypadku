<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<title>Dni bez wypadku</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Ograniczenie cache po stronie playera -->
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<style>
  :root{
    --accent: #f58c1f;     /* Pomarańcz wartości */
    --text:   #000000;     /* Czerń etykiet */
    --bg1:    #c9a268;     /* ciemniejszy dół/lewa */
    --bg2:    #efe6d6;     /* jaśniejsza prawa/góra */
    --maxW:   1400px;      /* maksymalna szerokość treści */
  }

  /* Pełny ekran z gradientem jak w projekcie */
  html, body {
    height: 100%;
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    /* Kierunek: z lewego-dolnego do prawego-górnego rogu */
    background: linear-gradient(25deg, var(--bg1) 0%, var(--bg2) 55%);
  }

  /* Kontener główny: logo na top-right, treść przy dolnej krawędzi i wyśrodkowana */
  .stage {
    position: relative;
    height: 100%;
    width: 100%;
    overflow: hidden;

    display: flex;
    flex-direction: column;
    justify-content: flex-end; /* treść schodzi do dołu */
    align-items: center;       /* wyśrodkowanie w poziomie */
  }

  /* Logo w prawym górnym rogu */
  .logo-wrap {
    position: absolute;
    top: 2.8vh;
    right: 3.6vw;
    display: flex;
    align-items: center;
    gap: 1.0vw;
  }
  .logo-wrap img {
    height: 8vh;              /* skalowanie względne wysokości ekranu */
    width: auto;
    display: block;
  }
  .logo-text {
    font-size: min(2.6vw, 34px);
    color: var(--text);
    font-weight: 700;
    line-height: 1;
    white-space: nowrap;
  }

  /* Blok z trzema wierszami na dole */
  .board {
    width: min(92vw, var(--maxW));
    padding: 4vh 2vw 6vh;     /* większy dół dla oddechu, jak w makiecie */
    box-sizing: border-box;
    text-align: center;       /* wyśrodkowanie napisów */
  }

  .row {
    display: inline-flex;
    align-items: baseline;
    gap: 1.2vw;
    margin: 2.6vh 0;          /* odstępy między wierszami jak w slajdzie */
  }

  .label {
    color: var(--text);
    font-weight: 900;
    letter-spacing: .5px;
    /* rozmiar skalowany do szerokości ekranu, z górnym ograniczeniem */
    font-size: clamp(22px, 2.8vw, 38px);
  }

  .value {
    color: var(--accent);
    font-weight: 900;
    letter-spacing: .5px;
    font-size: clamp(26px, 3.4vw, 46px);
  }

  /* Delikatna cienka ramka jak na przykładowej grafice (opcjonalne) */
  .frame {
    position: absolute;
    inset: .8vh .8vw;
    border: 1px solid rgba(0,0,0,.15);
    pointer-events: none;
  }

  /* Znacznik build do diagnostyki (możesz wyłączyć) */
  .build {
    position: fixed;
    bottom: .8vh; right: 1.0vw;
    font-size: 12px;
    color: rgba(0,0,0,.5);
  }
</style>
</head>
<body>
  <div class="stage">
    <!-- LOGO w prawym górnym rogu -->
    <div class="logo-wrap">
      <!-- PODSTAW SWÓJ ADRES LOGO (PNG/SVG z tłem przezroczystym) -->
      <img id="logoImg" src="https://raw.githubusercontent.com/macieksuperdrob-max/dni_bez_wypadku/main/logo.png" alt="Logo" />
      <div class="logo-text">Plant‑Tec Europe</div>
    </div>

    <!-- RAMKA (opcjonalna), komentarz aby wyłączyć -->
    <div class="frame"></div>

    <!-- BLOK NA DOLE, WYŚRODKOWANY -->
    <div class="board">
      <div class="row">
        <span class="label">DNI BEZ WYPADKU:</span>
        <span class="value" id="days">---</span>
      </div>
      <div class="row">
        <span class="label">REKORD DNI BEZ WYPADKU:</span>
        <span class="value" id="record">---</span>
      </div>
      <div class="row">
        <span class="label">DATA OSTATNIEGO WYPADKU:</span>
        <span class="value" id="last-date">--.--.----</span>
      </div>
    </div>

    <div class="build" id="buildInfo"></div>
  </div>

<script>
/* ===========================
   CONFIG
   =========================== */
const CONFIG = {
  LAST_ACCIDENT_ISO: '2024-04-19',     // domyślna data (RRRR-MM-DD)
  RECORD_BASE_DAYS: 1070,              // dotychczasowy rekord historyczny
  AUTO_SAVE_NEW_RECORD: true,          // zapamiętywanie nowego rekordu
  LOCALSTORAGE_KEY: 'planttec_bhp_record_days',
  LOGO_URL: 'https://raw.githubusercontent.com/macieksuperdrob-max/dni_bez_wypadku/main/logo.png'
};

/* ===========================
   Parametry URL (opcjonalne)
   ?date=RRRR-MM-DD
   ?record=1234
   ?logo=https://.../logo.svg
   =========================== */
const url = new URL(window.location.href);
const dateParam   = url.searchParams.get('date');
const recordParam = url.searchParams.get('record');
const logoParam   = url.searchParams.get('logo');

if (dateParam)   CONFIG.LAST_ACCIDENT_ISO = dateParam;
if (recordParam && !Number.isNaN(Number(recordParam))) {
  CONFIG.RECORD_BASE_DAYS = Number(recordParam);
}
if (logoParam)   CONFIG.LOGO_URL = logoParam;

/* ===========================
   Pomocnicze funkcje
   =========================== */
function atMidnight(d) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function daysBetween(a, b) {
  const MS = 24*60*60*1000;
  return Math.floor((atMidnight(b) - atMidnight(a)) / MS);
}

/* ===========================
   Logika wyliczeń + render
   =========================== */
const lastAccident = new Date(CONFIG.LAST_ACCIDENT_ISO + 'T00:00:00');
const now = new Date();
const today = atMidnight(now);

const currentStreak = daysBetween(lastAccident, today);

let record = Math.max(CONFIG.RECORD_BASE_DAYS, currentStreak);
try {
  const saved = localStorage.getItem(CONFIG.LOCALSTORAGE_KEY);
  if (saved !== null && !Number.isNaN(Number(saved))) {
    record = Math.max(record, Number(saved));
  }
  if (CONFIG.AUTO_SAVE_NEW_RECORD && currentStreak > Number(saved ?? -1)) {
    localStorage.setItem(CONFIG.LOCALSTORAGE_KEY, String(currentStreak));
  }
} catch(e){ /* player może blokować localStorage – ignorujemy */ }

document.getElementById('days').textContent   = currentStreak;
document.getElementById('record').textContent = record;

const fmtPL = new Intl.DateTimeFormat('pl-PL', { day:'2-digit', month:'2-digit', year:'numeric' });
document.getElementById('last-date').textContent = fmtPL.format(lastAccident);

// ustaw logo z config / parametru
document.getElementById('logoImg').src = CONFIG.LOGO_URL;

// build info do diagnostyki cache
document.getElementById('buildInfo').textContent =
  'Build: ' + new Date().toLocaleString('pl-PL');

/* Auto‑refresh po północy */
(function scheduleMidnightUpdate(){
  const nextMidnight = new Date(today.getTime() + 24*60*60*1000);
  const ms = nextMidnight - now;
  setTimeout(() => location.reload(true), ms + 2000);
})();
</script>
</body>
</html>
